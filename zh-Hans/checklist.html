<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="日课周修 · 燕云十六声玩家知识站。">
  <meta name="theme-color" content="#176b5b">
  <title>日课周修 · 燕云行笺</title>
  <link rel="icon" type="image/png" href="../assets/cat-goose-logo.png">
  <link rel="stylesheet" href="../styles.css?v=20260917-2">
  <script defer src="../scripts/pages.js?v=20260917"></script>
  <script defer src="../scripts/locales/zh-Hans.js?v=20260917"></script>
  <script defer src="../scripts/site.js?v=20260917-2"></script>
  <script defer src="../data/activities.js?v=20260915"></script>
  <script defer src="../data/limited-events.js?v=20260916-2"></script>
  <script defer src="../scripts/checklist.js?v=20260916"></script>
</head>
<body data-page="checklist">
  <header class="site-header"><a class="brand" href="../zh-Hans/checklist.html">燕云行笺 · 日课周修</a></header>
  <main>
<section id="checklist" class="checklist-page" aria-labelledby="checklist-title">
      <div class="page-heading">
        <div><p class="eyebrow">今日江湖备忘</p><h1 id="checklist-title">日课周修</h1><p>按你的养成目标排出优先顺序，完成状态仅保存在当前设备。</p></div>
        <div class="reset-note"><span id="beijing-time">北京时间</span><small id="next-reset">正在计算下次重置</small></div>
      </div>

      <div class="goal-control">
        <div><span class="goal-label">养成目标</span><span class="info-tip" tabindex="0" role="img" aria-label="优先级将按照所选养成目标显示和排序" data-tooltip="优先级将按照所选养成目标显示和排序">?</span><small>选择你当前最关注的成长方向</small></div>
        <select id="goal-filter" aria-label="选择养成目标"><option value="role">角色养成</option><option value="pvp">PVP养成</option><option value="cosmetic">外观收集</option></select>
      </div>

      <div class="toolbar" aria-label="筛选与搜索">
        <label>优先级<select id="priority-filter"><option value="all">全部</option><option value="高">高</option><option value="中">中</option><option value="低">低</option></select></label>
        <label class="search-label">想要的奖励<input id="search" type="search" placeholder="输入奖励名称…"><span class="quick-search" aria-label="常用奖励"><button type="button">心法</button><button type="button">长鸣玉</button><button type="button">装备</button><button type="button">通宝</button><button type="button">外观</button><button type="button">袅袅之音</button><button type="button">武学</button><button type="button">奇术</button></span></label>
        <label class="toggle"><input id="hide-completed" type="checkbox">隐藏已完成</label>
      </div>

      <div class="period-tabs" role="tablist" aria-label="活动频度">
        <button role="tab" aria-selected="false" data-period="Limited">限时活动 <span id="limited-count"></span></button>
        <button role="tab" aria-selected="true" data-period="Daily">每日 <span id="daily-count"></span></button>
        <button role="tab" aria-selected="false" data-period="Recurring">每周 / 每月 <span id="recurring-count"></span></button>
      </div>
      <div class="progress-row"><div><strong id="progress-label">今日进度</strong><span id="progress-text"></span></div><div class="progress-track" aria-hidden="true"><i id="progress-bar"></i></div></div>
      <div id="activity-list" class="activity-list" aria-live="polite"></div>
      <p id="empty-state" class="empty" hidden>没有符合当前筛选条件的活动。</p>
    </section>
  </main>
  
  <footer>Unofficial fan-made guide. Where Winds Meet and related game assets are property of NetEase/Everstone Studio. This site is not affiliated with or endorsed by NetEase.</footer>
</body>
</html>
